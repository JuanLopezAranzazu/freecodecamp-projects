<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Roman Numeral Converter</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="container">

    <div class="card">

      <span class="badge">NUMBER CONVERTER</span>

      <h1>
        Roman Numeral
        <span>Converter</span>
      </h1>

      <p class="description">
        Enter an Arabic number and transform it into its Roman numeral
        representation.
      </p>

      <div class="converter">

        <label for="number">Enter a number</label>

        <div class="input-group">

          <input
        type="number"
        id="number"
        placeholder="e.g. 2026"
        autocomplete="off"
      >

          <button id="convert-btn">
        Convert
      </button>

        </div>

        <div id="output"></div>

      </div>

      <div class="examples">
        <span>Try:</span>

        <button type="button" class="example">
      9
    </button>

        <button type="button" class="example">
      649
    </button>

        <button type="button" class="example">
      2026
    </button>

        <button type="button" class="example">
      3999
    </button>
      </div>

      <div class="symbols">
        <div>
          <strong>I</strong>
          <span>1</span>
        </div>

        <div>
          <strong>V</strong>
          <span>5</span>
        </div>

        <div>
          <strong>X</strong>
          <span>10</span>
        </div>

        <div>
          <strong>L</strong>
          <span>50</span>
        </div>

        <div>
          <strong>C</strong>
          <span>100</span>
        </div>

        <div>
          <strong>D</strong>
          <span>500</span>
        </div>

        <div>
          <strong>M</strong>
          <span>1000</span>
        </div>
      </div>

    </div>

  </main>

  <script src="script.js"></script>

</body>

</html>
