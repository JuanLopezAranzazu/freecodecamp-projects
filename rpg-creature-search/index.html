<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RPG Creature Search</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="container">
      <section class="card">
        <span class="badge">RPG DATABASE</span>

        <h1>
          Creature
          <span>Search</span>
        </h1>

        <p class="description">
          Search the RPG creature database by name or ID to discover its stats,
          type and characteristics.
        </p>

        <div class="search-box">
          <label for="search-input"> Search creature </label>

          <div class="search-group">
            <input
              type="text"
              id="search-input"
              required
              placeholder="Enter name or ID..."
            />
            <button id="search-button">Search</button>
          </div>
        </div>

        <section class="creature-card">
          <div class="creature-header">
            <div>
              <span class="small-label"> CREATURE </span>
              <h2 id="creature-name">—</h2>
              <span id="creature-id" class="creature-id"> — </span>
            </div>

            <div id="creature-image" class="creature-image">?</div>
          </div>

          <div class="physical-info">
            <div class="info-item">
              <span class="info-label"> Weight </span>
              <strong id="weight"> — </strong>
            </div>

            <div class="info-item">
              <span class="info-label"> Height </span>
              <strong id="height"> — </strong>
            </div>
          </div>

          <div class="types-section">
            <span class="info-label"> Types </span>
            <div id="types"></div>
          </div>

          <div class="stats">
            <div class="stat">
              <span>HP</span>
              <strong id="hp">—</strong>
            </div>

            <div class="stat">
              <span>ATTACK</span>
              <strong id="attack">—</strong>
            </div>

            <div class="stat">
              <span>DEFENSE</span>
              <strong id="defense">—</strong>
            </div>

            <div class="stat">
              <span>SPECIAL ATTACK</span>
              <strong id="special-attack">—</strong>
            </div>

            <div class="stat">
              <span>SPECIAL DEFENSE</span>
              <strong id="special-defense">—</strong>
            </div>

            <div class="stat">
              <span>SPEED</span>
              <strong id="speed">—</strong>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
