<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>JavaScript Calculator</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="calculator">
      <div class="calculator-header">
        <span class="eyebrow">CALCULATOR</span>
        <h1>JavaScript Calculator</h1>
      </div>

      <div id="display">0</div>

      <div class="buttons">
        <button id="clear" class="clear" type="button">AC</button>

        <button id="divide" class="operator" type="button">/</button>

        <button id="multiply" class="operator" type="button">×</button>

        <button id="seven" type="button">7</button>

        <button id="eight" type="button">8</button>

        <button id="nine" type="button">9</button>

        <button id="subtract" class="operator" type="button">-</button>

        <button id="four" type="button">4</button>

        <button id="five" type="button">5</button>

        <button id="six" type="button">6</button>

        <button id="add" class="operator" type="button">+</button>

        <button id="one" type="button">1</button>

        <button id="two" type="button">2</button>

        <button id="three" type="button">3</button>

        <button id="equals" class="equals" type="button">=</button>

        <button id="zero" class="zero" type="button">0</button>

        <button id="decimal" type="button">.</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
