<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>25 + 5 Clock</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="clock">
      <div class="clock-header">
        <span class="eyebrow">FOCUS TIMER</span>
        <h1>25 + 5 Clock</h1>
      </div>

      <section class="settings">
        <!-- Break -->

        <div class="setting">
          <h2 id="break-label">Break Length</h2>

          <div class="controls">
            <button id="break-decrement" type="button">−</button>

            <span id="break-length">5</span>

            <button id="break-increment" type="button">+</button>
          </div>
        </div>

        <!-- Session -->

        <div class="setting">
          <h2 id="session-label">Session Length</h2>

          <div class="controls">
            <button id="session-decrement" type="button">−</button>

            <span id="session-length">25</span>

            <button id="session-increment" type="button">+</button>
          </div>
        </div>
      </section>

      <!-- Timer -->

      <section class="timer">
        <h2 id="timer-label">Session</h2>

        <div id="time-left">25:00</div>

        <div class="timer-controls">
          <button id="start_stop" type="button">Start</button>

          <button id="reset" type="button">Reset</button>
        </div>
      </section>

      <!-- Alarm -->

      <audio
        id="beep"
        preload="auto"
        src="https://cdn.freecodecamp.org/testable-projects-fcc/audio/BeepSound.wav"
      ></audio>
    </main>

    <script src="script.js"></script>
  </body>
</html>
